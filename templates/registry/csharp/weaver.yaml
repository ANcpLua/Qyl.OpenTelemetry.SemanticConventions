      | $registry
      | def pascal($s): $s | gsub("[_\\-]"; ".") | split(".")
                     | map(select(length > 0) | (.[0:1] | ascii_upcase) + .[1:]) | join("");
      def dedupe(f): group_by(f) | map(sort_by([(if .deprecated then 1 else 0 end), f]) | .[0]);
      ([.registry.attributes[]]) as $top
      | ($top | map({key: .key, value: true}) | from_entries) as $seen
      | ([.dependencies[].registry.attributes[]] | map(select($seen[.key] | not))) as $extra
      | (($top + $extra) | sort_by(.key)) as $all
      | [ ($all
            | map(select((.stability == "stable" or (.deprecated != null)) | not))
            | group_by(.key | split(".")[0]) | .[]
            | (.[0].key | split(".")[0]) as $root
            | ($root | split("_") | map((.[0:1] | ascii_upcase) + .[1:]) | join("")) as $p
            | {tier: "incubating", root: $root, pascal_root: $p, type_root: ($p + "Incubating"),
               attributes: (. | dedupe(pascal(.key)) | sort_by(.key)),
               namespace: ("Qyl.Telemetry.SemanticConventions.Incubating.Activities"),
               out_dir: "src/Qyl.Telemetry.SemanticConventions.Incubating/Generated"}),
          ($all
            | map(select(.stability == "stable" or (.deprecated != null)))
            | group_by(.key | split(".")[0]) | .[]
            | (.[0].key | split(".")[0]) as $root
            | ($root | split("_") | map((.[0:1] | ascii_upcase) + .[1:]) | join("")) as $p
            | {tier: "stable", root: $root, pascal_root: $p, type_root: $p,
               attributes: (. | dedupe(pascal(.key)) | sort_by(.key)),
               namespace: ("Qyl.Telemetry.SemanticConventions.Activities"),
               out_dir: "src/Qyl.Telemetry.SemanticConventions/Generated"}) ]
      | map(. + $schema_urls)
    application_mode: each
    file_name: "{{ ctx.out_dir }}/Activities/{{ ctx.type_root }}Activities.g.cs"

