whitespace_control:
  trim_blocks: true
  lstrip_blocks: true
  keep_trailing_newline: true

# Defaults for a bare `weaver registry generate`; scripts/generate.sh overrides them with -D.
params:
  weaver_version: "0.26.1"
  qyl_schema_url: "https://qyl.at/schemas/9.0.0"
  core_ref: "v1.44.0"
  core_commit: ""
  core_schema_url: "https://opentelemetry.io/schemas/1.44.0"
  genai_commit: "fee465db333bdd6a7d2faa320edab5cf3101a4f4"
  genai_schema_url: "https://opentelemetry.io/schemas/gen-ai-dev/1.42.0-dev"

templates:
  # The upstream key surface qyl-api-schema consumes across the repository boundary. qyl's own
  # vocabulary (including the deletion-targeted qyl.mcp.* staging namespace) and the vendor
  # rows are excluded on purpose: qyl-api-schema owns qyl's public transport contracts, so
  # qyl.* reaches it through an explicit owner-first contract change, never as a side effect.
  #
  # The grouping is done here rather than in the template: rebuilding a list of lists per
  # attribute in Jinja is quadratic and does not finish.
  - template: otel-keys.tsp.j2
    filter: >
      ([.registry.attributes[]]) as $top
      | ($top | map({key: .key, value: true}) | from_entries) as $seen
      | ([.dependencies[].registry.attributes[]] | map(select($seen[.key] | not))) as $extra
      | (($top + $extra)
          | map(select((.provenance.path // "") | startswith("registry/") | not))
          | sort_by(.key)) as $all
      | {namespaces: [ $all
            | group_by(.key | split(".")[0]) | .[]
            | (.[0].key | split(".")[0]) as $root
            | ($root | split("_") | map((.[0:1] | ascii_upcase) + .[1:]) | join("")) as $p
            | {pascal_root: $p, root: $root,
               attributes: [ .[] | {key: .key, brief: (.brief // ""), deprecated: .deprecated,
                                    rest: (if (.key | index(".")) == null
                                           then .key
                                           else .key[((.key | index(".")) + 1):] end)} ]}
          ] | sort_by(.pascal_root)}
    application_mode: single
    file_name: "generated/typespec/otel-keys.gen.tsp"
