# Weaver template config for the Roslyn source generator's embedded
# resolved-registry. Emits a minimal qyl-owned JSON projection (one file)
# that the analyzer reads at compile time with the local JsonReader.
#
# This is NOT the resolved-registry-v2 contract; it is the smallest projection
# that satisfies the generator's needs. The projection is generated once for
# core semconv and once for semantic-conventions-genai, then merged by
# scripts/generate.sh.

whitespace_control:
  trim_blocks: true
  lstrip_blocks: true
  keep_trailing_newline: true

params:
  schema_version: ""
  source_registry: "core"
  source_ref: ""
  source_commit: ""
  source_date_epoch: "0"
  weaver_version: "0.25.1"

templates:
  - template: resolved-registry.json.j2
    filter: "."
    application_mode: single
    file_name: "Resources/resolved-registry.json"
