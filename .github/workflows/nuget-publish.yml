# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Publish to NuGet

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish, without a v prefix
        required: true
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: semantic-conventions-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: nuget
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: Directory.Packages.props

      - name: Validate release input
        id: release
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "::error::releases must run from main"
            exit 1
          fi
          if [[ ! "${VERSION}" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "::error::invalid package version: ${VERSION}"
            exit 1
          fi
          if git rev-parse --verify --quiet "refs/tags/v${VERSION}"; then
            echo "::error::tag v${VERSION} already exists"
            exit 1
          fi

          package_ids=(
            Qyl.OpenTelemetry.SemanticConventions
            Qyl.OpenTelemetry.SemanticConventions.Incubating
            Qyl.OpenTelemetry.SemanticConventions.SourceGeneration
          )
          mkdir -p artifacts/existing
          for package_id in "${package_ids[@]}"; do
            lower_id="$(printf '%s' "${package_id}" | tr '[:upper:]' '[:lower:]')"
            lower_version="$(printf '%s' "${VERSION}" | tr '[:upper:]' '[:lower:]')"
            url="https://api.nuget.org/v3-flatcontainer/${lower_id}/${lower_version}/${lower_id}.${lower_version}.nupkg"
            archive="artifacts/existing/${lower_id}.${lower_version}.nupkg"
            status="$(curl --silent --show-error --location --retry 5 --retry-all-errors \
              --output "${archive}" --write-out '%{http_code}' "${url}")"
            if [[ "${status}" == "404" ]]; then
              rm -f "${archive}"
              continue
            fi
            if [[ "${status}" != "200" ]]; then
              echo "::error::nuget.org returned HTTP ${status} for ${package_id} ${VERSION}"
              exit 1
            fi

            published_commit="$(unzip -p "${archive}" '*.nuspec' \
              | sed -n 's/.*<repository[^>]*commit="\([^"]*\)".*/\1/p' \
              | head -n 1)"
            if [[ "${published_commit}" != "${GITHUB_SHA}" ]]; then
              echo "::error::${package_id} ${VERSION} already exists from commit ${published_commit:-unknown}, not ${GITHUB_SHA}"
              exit 1
            fi
            echo "Resuming the same release: ${package_id} ${VERSION} is already published from ${GITHUB_SHA}."
          done
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Restore
        run: dotnet restore Qyl.OpenTelemetry.SemanticConventions.slnx

      - name: Verify generated surfaces
        run: |
          set -euo pipefail
          ./build.sh VerifyAttributesHash
          ./build.sh CheckDocs
          python3 src/Qyl.OpenTelemetry.SemanticConventions.SourceGeneration/scripts/verify_deprecated_catalog.py

      - name: Build
        run: >-
          dotnet build Qyl.OpenTelemetry.SemanticConventions.slnx
          --configuration Release
          --no-restore
          -p:Version=${{ steps.release.outputs.version }}

      - name: Test analyzer pipeline
        run: >-
          dotnet run
          --project tests/Qyl.OpenTelemetry.SemanticConventions.Pipeline.Tests
          --configuration Release
          --no-build

      - name: Test source generation
        run: >-
          dotnet run
          --project tests/Qyl.OpenTelemetry.SemanticConventions.SourceGeneration.Tests
          --configuration Release
          --no-build

      - name: Pack supported packages
        run: >-
          dotnet pack Qyl.OpenTelemetry.SemanticConventions.slnx
          --configuration Release
          --no-build
          --output artifacts/packages
          -p:Version=${{ steps.release.outputs.version }}

      - name: Inspect and smoke packed artifacts
        run: >-
          ./eng/release/verify-packages.sh
          ${{ steps.release.outputs.version }}
          "${GITHUB_WORKSPACE}/artifacts/packages"
          "${GITHUB_WORKSPACE}/artifacts/packages"

      - name: NuGet login
        id: nuget_login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish to nuget.org
        env:
          NUGET_API_KEY: ${{ steps.nuget_login.outputs.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          for package in artifacts/packages/*.nupkg; do
            dotnet nuget push "${package}" \
              --source https://api.nuget.org/v3/index.json \
              --api-key "${NUGET_API_KEY}" \
              --skip-duplicate
          done

      - name: Wait for nuget.org indexing
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          package_ids=(
            Qyl.OpenTelemetry.SemanticConventions
            Qyl.OpenTelemetry.SemanticConventions.Incubating
            Qyl.OpenTelemetry.SemanticConventions.SourceGeneration
          )
          for package_id in "${package_ids[@]}"; do
            lower_id="$(printf '%s' "${package_id}" | tr '[:upper:]' '[:lower:]')"
            lower_version="$(printf '%s' "${VERSION}" | tr '[:upper:]' '[:lower:]')"
            url="https://api.nuget.org/v3/registration5-gz-semver2/${lower_id}/${lower_version}.json"
            indexed=false
            for attempt in $(seq 1 60); do
              if curl --compressed --fail --silent --location "${url}?attempt=${attempt}" \
                | jq -e --arg package_url \
                  "https://api.nuget.org/v3-flatcontainer/${lower_id}/${lower_version}/${lower_id}.${lower_version}.nupkg" \
                  '.listed == true and .packageContent == $package_url' >/dev/null; then
                indexed=true
                break
              fi
              echo "Waiting for ${package_id} ${VERSION} (${attempt}/60)"
              sleep 10
            done
            if [[ "${indexed}" != true ]]; then
              echo "::error::${package_id} ${VERSION} was not indexed within 10 minutes"
              exit 1
            fi
          done

      - name: Smoke published packages from a clean consumer
        run: >-
          ./eng/release/verify-packages.sh
          ${{ steps.release.outputs.version }}
          https://api.nuget.org/v3/index.json

      - name: Unlist the retired Nuke component
        env:
          NUGET_API_KEY: ${{ steps.nuget_login.outputs.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          package_id="Qyl.OpenTelemetry.SemanticConventions.Nuke"
          registration="https://api.nuget.org/v3/registration5-gz-semver2/qyl.opentelemetry.semanticconventions.nuke/index.json"

          listed_versions="$(curl --compressed --fail --silent --show-error --location \
            --retry 5 --retry-all-errors "${registration}" \
            | jq -r '.items[].items[]?.catalogEntry | select(.listed != false) | .version')"
          while IFS= read -r retired_version; do
            [[ -z "${retired_version}" ]] && continue
            dotnet nuget delete "${package_id}" "${retired_version}" \
              --source https://api.nuget.org/v3/index.json \
              --api-key "${NUGET_API_KEY}" \
              --non-interactive
          done <<< "${listed_versions}"

          for attempt in $(seq 1 30); do
            still_listed="$(curl --compressed --fail --silent --show-error --location \
              --retry 5 --retry-all-errors "${registration}?attempt=${attempt}" \
              | jq '[.items[].items[]?.catalogEntry | select(.listed != false)] | length')"
            [[ "${still_listed}" == "0" ]] && break
            if [[ "${attempt}" == "30" ]]; then
              echo "::error::${still_listed} retired ${package_id} version(s) remain listed"
              exit 1
            fi
            sleep 10
          done

      - name: Tag and announce verified release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git tag --annotate "v${VERSION}" --message "v${VERSION}"
          git push origin "v${VERSION}"
          gh release create "v${VERSION}" --verify-tag --generate-notes --title "v${VERSION}"
