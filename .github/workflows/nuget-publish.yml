# CANONICAL-DEPARTURE: multi-stage release pipeline with main-ancestry, version/schema, package-set, indexing and published-consumer gates plus a GitHub release job
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
#
# Derived from ANcpLua/github-settings-automation/templates/nuget-publish.yml.
# The CANONICAL-DEPARTURE marker on line 1 makes sync-nuget-publish.sh skip this
# file, so the release gates below survive a template sync. Keep the marker.
# Local departures from the template are each marked `# Departure (SC-n):`
# or `# Departure (main ancestry):`.
#
# Algorithm:
#   - Triggered only by a `v*` tag push; the tag is the release act.
#   - Fails unless the tagged commit is reachable from origin main.
#   - Fails unless the tag equals VersionPrefix and the registry schema_url,
#     and unless https://qyl.at/schemas/<version> is served.
#   - Discovers the repo's `.slnx` or `.sln` at the repo root, restores +
#     builds it with the version override, packs the whole solution,
#     pushes every produced `.nupkg` to nuget.org and GitHub Packages.
#
# Auth model: NuGet TRUSTED PUBLISHING via OIDC (no static API key).
#   - `id-token: write` permission gives the runner a short-lived OIDC
#     token. `NuGet/login@v1` exchanges it for a TEMPORARY (per-job) API
#     key. That key is only valid for ~30 min and is used only on this
#     single workflow run.
#   - Requires three things to exist:
#       a) A Trusted Publisher policy on nuget.org/account/trustedpublishers
#          matching this repo + this workflow file (+ optional environment).
#          Filling in the form with Workflow File = `nuget-publish.yml`
#          authorizes every package owned by the same Package Owner.
#       b) `NUGET_USER` repo secret on the consumer repo (the nuget.org
#          username, e.g. `ANcpLua`). The `NuGet/login` action embeds
#          this in the OIDC token exchange.
#       c) The Trusted Publisher policy's "Package Owner" must own every
#          package being pushed (PackageId mismatch = 401 on push).
#   - No `NUGET_API_KEY` secret needed. Rotation is automatic — keys live
#     only for the workflow run.
#
# Opt-out:
#   - To deliberately diverge from canonical in one specific repo, add a
#     line `# CANONICAL-DEPARTURE: <reason>` at the top of the consumer
#     repo's copy. The sync script honors that marker and won't overwrite.
#   - Valid reasons for departure: Authenticode signing, multi-stage
#     release pipeline, custom PackageId override.

name: Publish to NuGet

on:
  push:
    tags:
      - 'v*'
  # Departure (SC-8): no workflow_dispatch. A manual run with a typed version
  # interpolated untrusted input into the shell and could publish a version no
  # tag names; the tag push is the only release act.

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: write
    # nuget.org Trusted Publisher policies for this fleet set Environment = 'nuget';
    # the OIDC exchange 401s ("Environment mismatch ... expected 'nuget', actual ''")
    # without this. Policies that set no environment ignore the claim, so this is
    # safe for every consumer.
    environment: nuget
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # Departure (main ancestry): the nuget environment admits main and v* tags, but a
      # v* tag can name a commit that never reached main. Publish only commits main
      # already contains, checked before anything is built, packed or pushed.
      # refs/heads/main is spelled out because a bare "main" would resolve a tag named
      # main ahead of the branch.
      - name: Require the tagged commit to be on main
        run: |
          set -euo pipefail
          git fetch --no-tags origin refs/heads/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            echo "::error::$GITHUB_SHA is not reachable from origin main ($(git rev-parse FETCH_HEAD)); only commits main already contains are published."
            exit 1
          fi
          echo "$GITHUB_SHA is on origin main ($(git rev-parse FETCH_HEAD))."

      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1

      # Departure (SC-1): the tag must be vX.Y.Z and name the version the sources
      # already declare in Directory.Build.props and registry/manifest.yaml.
      - name: Determine version and require it to match the sources
        id: version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag '$tag' is not vX.Y.Z"
            exit 1
          fi
          version="${tag#v}"
          prefix="$(sed -n 's:.*<VersionPrefix[^>]*>\([^<]*\)</VersionPrefix>.*:\1:p' Directory.Build.props)"
          schema="$(sed -n 's#^schema_url: https://qyl.at/schemas/##p' registry/manifest.yaml)"
          if [ "$version" != "$prefix" ] || [ "$version" != "$schema" ]; then
            echo "::error::tag $tag != VersionPrefix '$prefix' / registry/manifest.yaml schema_url suffix '$schema'"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Discover solution
        id: sln
        run: |
          slnx="$(find . -maxdepth 1 -type f -name '*.slnx' -print -quit | sed 's#^\./##')"
          [ -z "$slnx" ] && slnx="$(find . -maxdepth 1 -type f -name '*.sln' -print -quit | sed 's#^\./##')"
          [ -z "$slnx" ] && { echo "::error::no .slnx or .sln at repo root"; exit 1; }
          echo "Solution: $slnx"
          echo "slnx=$slnx" >> "$GITHUB_OUTPUT"

      - name: Restore (no Version override — uses last-published self-references)
        run: dotnet restore "${{ steps.sln.outputs.slnx }}"

      - name: Build (Version override applied here)
        run: |
          dotnet build "${{ steps.sln.outputs.slnx }}" \
            -c Release --no-restore \
            -p:Version=${{ steps.version.outputs.version }}

      - name: Pack
        run: |
          dotnet pack "${{ steps.sln.outputs.slnx }}" \
            -c Release --no-build \
            -o artifacts \
            -p:Version=${{ steps.version.outputs.version }}
          ls -la artifacts/

      - name: Test and pack generated TypeScript
        run: |
          npm test --prefix typescript
          npm pack ./typescript --pack-destination artifacts

      # Departure (SC-9): publish exactly the three package IDs this repository ships,
      # never an empty or unexpected set.
      - name: Require exactly the three expected packages
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          expected="$(printf '%s\n' \
            "Qyl.Telemetry.SemanticConventions.${VERSION}.nupkg" \
            "Qyl.Telemetry.SemanticConventions.Analyzers.${VERSION}.nupkg" \
            "Qyl.Telemetry.SemanticConventions.Incubating.${VERSION}.nupkg" | sort)"
          actual="$(find artifacts -maxdepth 1 -type f -name '*.nupkg' -exec basename {} \; | sort)"
          if [ "$actual" != "$expected" ]; then
            echo "::error::expected exactly these packages:"
            echo "$expected"
            echo "::error::pack produced:"
            echo "${actual:-<none>}"
            exit 1
          fi

      - name: Require all NuGet and npm artifacts
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: python3 eng/release/verify-artifact-set.py artifacts "${VERSION}"

      # Departure (SC-2): the schema URL the packages advertise must already be served.
      - name: Require the schema URL to be served
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: curl -fsS --retry 3 -o /dev/null "https://qyl.at/schemas/${VERSION}"

      - name: NuGet login (OIDC → temp API key)
        id: nuget_login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to nuget.org (trusted publishing)
        run: |
          pkgs=(artifacts/*.nupkg)
          for p in "${pkgs[@]}"; do echo "Pushing $p"; done
          dotnet nuget push "${pkgs[@]}" \
            --source https://api.nuget.org/v3/index.json \
            --api-key "${{ steps.nuget_login.outputs.NUGET_API_KEY }}" \
            --skip-duplicate

      - name: Push to GitHub Packages
        run: |
          pkgs=(artifacts/*.nupkg)
          dotnet nuget push "${pkgs[@]}" \
            --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
            --api-key ${{ secrets.GITHUB_TOKEN }} \
            --skip-duplicate

      # Departure (SC-3, SC-4): wait until nuget.org serves the pushed packages and
      # prove them in a clean net10.0 consumer before the release job runs. The script
      # retries restore against nuget.org while the new version is not yet indexed.
      - name: Verify the published packages from nuget.org
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ./eng/release/verify-packages.sh "${VERSION}" https://api.nuget.org/v3/index.json

  # Every v* tag published a package and left no release entry, so the eight tags
  # this repository carries had zero releases between them while the sibling
  # repositories had one per tag. This is that missing step, copied from
  # Qyl.OpenTelemetry.AutoInstrumentation so the fleet publishes the same way.
  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      # github.token cannot create a release in this fleet — AutoInstrumentation's
      # v15.0.0 got HTTP 403 "Resource not accessible by integration" from it with
      # contents: write already declared and the repository default set to write.
      # The restriction is on the Actions token itself, so the release needs a token
      # supplied explicitly. Without RELEASE_TOKEN the step says so and fails rather
      # than retrying the token that is known not to work; the packages are already
      # on nuget.org by then, so this failure means "no release entry", not "no
      # release".
      - name: Create the GitHub release for the tag that triggered this run
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "RELEASE_TOKEN is not set; github.token cannot create releases in this repository" >&2
            exit 1
          fi
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release $tag already exists"
          else
            # --verify-tag: the tag is created by the push that triggered this run, never invented here.
            gh release create "$tag" \
              --verify-tag \
              --generate-notes \
              --title "$tag"
          fi
