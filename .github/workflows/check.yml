# The gate, reporting only: `mise run check` (regeneration drift, live-check policies, the
# TypeScript and pipeline tests) on every push to main and every pull request. Nothing
# publishes or waits for this run. A manual run with full=true runs `mise run check-full`
# (adds the coverage gate). A failed run keeps artifacts/logs as gate-log.
name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: Run mise run check-full instead of mise run check
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.full && 20 || 12 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1

      - name: Gate
        run: mise run ${{ inputs.full && 'check-full' || 'check' }}

      - name: Keep the gate log
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gate-log
          path: artifacts/logs/
          if-no-files-found: ignore
          retention-days: 7
