name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Test pin freshness checker
        run: python3 -m unittest discover --start-directory tests/scripts --pattern 'test_*.py'

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Qyl.Telemetry.SemanticConventions.slnx

      - name: Build
        run: dotnet build Qyl.Telemetry.SemanticConventions.slnx --no-restore --configuration Release

      # The analyzer deprecation catalog is hand-curated (since-versions, guidance
      # prose, deleted-upstream keys) but must never contradict the registry on
      # what the registry DOES know — renames, deprecations, enum-member removals.
      - name: Verify deprecated-semconv catalog against resolved registry
        run: python3 src/Qyl.Telemetry.SemanticConventions.SourceGeneration/scripts/verify_deprecated_catalog.py

      - name: Test analyzer pipeline
        run: dotnet run --project tests/Qyl.Telemetry.SemanticConventions.Pipeline.Tests/ --configuration Release --no-build

      - name: Test source generation
        run: dotnet run --project tests/Qyl.Telemetry.SemanticConventions.SourceGeneration.Tests/ --configuration Release --no-build

      - name: Pack
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: dotnet pack Qyl.Telemetry.SemanticConventions.slnx --no-build --configuration Release --output artifacts/packages

      - name: Inspect and smoke packed artifacts
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          version="$(dotnet msbuild src/Qyl.Telemetry.SemanticConventions/Qyl.Telemetry.SemanticConventions.csproj -getProperty:PackageVersion -nologo)"
          ./eng/release/verify-packages.sh "${version}" "${GITHUB_WORKSPACE}/artifacts/packages" "${GITHUB_WORKSPACE}/artifacts/packages"
