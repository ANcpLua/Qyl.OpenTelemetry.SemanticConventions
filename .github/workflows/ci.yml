name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Qyl.OpenTelemetry.SemanticConventions.slnx

      - name: Build
        run: dotnet build Qyl.OpenTelemetry.SemanticConventions.slnx --no-restore --configuration Release

      - name: Verify attribute manifest (dogfoods Qyl.OpenTelemetry.SemanticConventions.Nuke)
        run: ./build.sh VerifyAttributesHash

      # The analyzer deprecation catalog is hand-curated (since-versions, guidance
      # prose, deleted-upstream keys) but must never contradict the registry on
      # what the registry DOES know — renames, deprecations, enum-member removals.
      - name: Verify deprecated-semconv catalog against resolved registry
        run: python3 src/Qyl.OpenTelemetry.SemanticConventions.SourceGeneration/scripts/verify_deprecated_catalog.py

      # xunit.v3.mtp-v2 + .NET 10 SDK requires the Microsoft Testing Platform
       # entry point (per https://aka.ms/dotnet-test-mtp-error). Each test csproj
       # sets <OutputType>Exe</OutputType>, so `dotnet run` IS the MTP runner.
      - name: Test
        run: dotnet run --project tests/Qyl.OpenTelemetry.SemanticConventions.Pipeline.Tests/ --configuration Release --no-build

      - name: Pack
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: dotnet pack Qyl.OpenTelemetry.SemanticConventions.slnx --no-build --configuration Release --output artifacts/packages
