name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Test pin freshness checker
        run: python3 -m unittest discover --start-directory tests/scripts --pattern 'test_*.py'

      - name: Setup Weaver
        uses: open-telemetry/weaver/.github/actions/setup-weaver@38befce4bc68fe320d20f189465c93835ac20c12 # v0.26.1

      # Regenerates everything from registry/ and fails on drift, the same shape as the
      # check-generated target in opentelemetry-weaver-examples/basic/Makefile. This is the
      # gate that keeps the committed output honest; the Pipeline test only pins its hashes.
      - name: Check generated code is in sync with the registry
        run: ./scripts/check-generated.sh

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Qyl.Telemetry.SemanticConventions.slnx

      - name: Build
        run: dotnet build Qyl.Telemetry.SemanticConventions.slnx --no-restore --configuration Release

      - name: Test analyzer pipeline
        run: dotnet run --project tests/Qyl.Telemetry.SemanticConventions.Pipeline.Tests/ --configuration Release --no-build

      - name: Pack
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: dotnet pack Qyl.Telemetry.SemanticConventions.slnx --no-build --configuration Release --output artifacts/packages

      - name: Inspect and smoke packed artifacts
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          version="$(dotnet msbuild src/Qyl.Telemetry.SemanticConventions/Qyl.Telemetry.SemanticConventions.csproj -getProperty:PackageVersion -nologo)"
          ./eng/release/verify-packages.sh "${version}" "${GITHUB_WORKSPACE}/artifacts/packages" "${GITHUB_WORKSPACE}/artifacts/packages"
