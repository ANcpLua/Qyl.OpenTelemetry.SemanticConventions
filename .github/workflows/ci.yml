name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Qyl.OpenTelemetry.SemanticConventions.slnx

      - name: Build
        run: dotnet build Qyl.OpenTelemetry.SemanticConventions.slnx --no-restore --configuration Release

      - name: Verify attribute manifest (dogfoods Qyl.OpenTelemetry.SemanticConventions.Nuke)
        run: ./build.sh VerifyAttributesHash

      - name: Test
        run: dotnet test Qyl.OpenTelemetry.SemanticConventions.slnx --no-build --configuration Release

      - name: Pack
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: dotnet pack Qyl.OpenTelemetry.SemanticConventions.slnx --no-build --configuration Release --output artifacts/packages
