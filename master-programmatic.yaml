# OpenTelemetry semantic-conventions resolved registry — pinned snapshot.
#
# This file is the build-time INPUT to:
#   - Qyl.OpenTelemetry.SemanticConventions      (stable attribute keys → Attributes/**/*.g.cs)
#   - Qyl.OpenTelemetry.SemanticConventions.Incubating (incubating keys → Attributes/**/*.g.cs)
#   - Qyl.OpenTelemetry.SemanticConventions.SourceGeneration (SchemaUrl + opt-in domain emits)
#
# Provenance is enforced by `eng/build` (VerifyAttributesHash target — exercises
# Qyl.OpenTelemetry.SemanticConventions.Nuke.LockstepPolicy + dogfoods the Nuke
# component this repo SHIPS).
#
# This file is intentionally committed as an EMPTY PLACEHOLDER; run
# `scripts/seed-catalog.sh [version]` to materialise the resolved registry from
# `open-telemetry/semantic-conventions@v{version}` (default: matches the
# SemConvSchemaVersion property in Version.props, 1.41.0).
#
# Why a placeholder instead of vendoring the full file: the resolved registry
# is ~3 MB and changes every semconv release. Committing a hash-pinned pull
# script keeps the repo lean and makes upstream bumps a one-line operation
# without exploding diff noise on every renovation PR.
schema_version: 1.41.0
status: placeholder
hint: run `scripts/seed-catalog.sh` to populate this file.
