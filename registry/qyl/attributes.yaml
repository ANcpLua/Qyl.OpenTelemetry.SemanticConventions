        brief: "First dot-segment of the attribute key a collector measurement is about."
        note: "The value set is closed and is exactly the attribute namespaces present in the merged registry plus `other`: the collector clamps every value it records to this set, so an inbound payload carrying an unknown key cannot fork the series. merge_registries.py recomputes the set from the merged catalog on every generation and fails the merge when the two disagree, so a registry that gains a namespace cannot silently leave it unlisted."
