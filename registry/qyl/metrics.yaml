# qyl-owned metrics.
groups:
  - id: metric.qyl.nservicebus_messaging_operation_duration
    type: metric
    metric_name: nservicebus.messaging.operation.duration
    instrument: histogram
    unit: "s"
    stability: development
    brief: "Duration of an NServiceBus send or publish operation."
    attributes:
      - ref: messaging.system
        requirement_level: required
      - ref: messaging.operation.type
        requirement_level:
          conditionally_required: "If applicable."
      - ref: messaging.operation.name
        requirement_level: required
  - id: metric.qyl.qyl_collector_attributes_dropped
    type: metric
    metric_name: qyl.collector.attributes.dropped
    instrument: counter
    unit: "{attribute}"
    stability: development
    brief: "Attributes the collector dropped under its explicit persistence policy."
    note: "Registry membership does not restrict application attributes. This counts policy denials by a bounded namespace, without recording attribute values."
    attributes:
      - ref: qyl.attribute.namespace
        requirement_level: required
  - id: metric.qyl.qyl_collector_attributes_coalesced
    type: metric
    metric_name: qyl.collector.attributes.coalesced
    instrument: counter
    unit: "{attribute}"
    stability: development
    brief: "Identical typed duplicate attributes coalesced into one map entry at ingest."
    note: "For example, an ILogger message and its activity scope can export the same TraceId. Only identical values are coalesced; conflicting duplicate values are rejected explicitly. Count by a bounded namespace and never record the value."
    attributes:
      - ref: qyl.attribute.namespace
        requirement_level: required
