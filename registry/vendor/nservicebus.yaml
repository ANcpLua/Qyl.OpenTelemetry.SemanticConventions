        note: "Span tag on the \"NServiceBus.Core\" ActivitySource. Declared at src/NServiceBus.Core/OpenTelemetry/Tracing/ActivityTags.cs:38; set at src/NServiceBus.Core/OpenTelemetry/Tracing/ActivityDecorator.cs:14 (PromoteHeadersToTags, HeaderMapping). Promoted from the `NServiceBus.NonDurableMessage` header when a message carries it (ActivityDecorator.cs:54); NServiceBus.Core 10.2.9 itself never sets that header, so the tag appears only for messages whose sender (another NServiceBus package or an older endpoint) did."
