        note: "Span tag on the \"NServiceBus.Core\" ActivitySource. Declared at src/NServiceBus.Core/OpenTelemetry/Tracing/ActivityTags.cs:37; set at src/NServiceBus.Core/OpenTelemetry/Tracing/ActivityDecorator.cs:14 (PromoteHeadersToTags, HeaderMapping). Promoted from the `NServiceBus.DataBusConfig.ContentType` header when a message carries it (ActivityDecorator.cs:53); NServiceBus.Core 10.2.9 itself never sets that header, the ClaimCheck package does."
        examples:
