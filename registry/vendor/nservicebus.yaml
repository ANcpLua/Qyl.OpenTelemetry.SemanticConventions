# NServiceBus 10.2.9 — the attributes the library puts on the spans of its own
# ActivitySource and that upstream semantic conventions do not define. Vendor keys are
# tags: the collector passes them through, the application never renames them.
#
# Two groups: `registry.vendor.*` carries the attributes into the resolved catalog (which
# drops group annotations), `vendor.*` carries the library metadata, which survives as a
# plain attribute group.
groups:
  - id: registry.vendor.nservicebus
    type: attribute_group
    display_name: "NServiceBus Vendor Attributes"
    brief: "Attributes NServiceBus 10.2.9 puts on the spans of its own \"NServiceBus.Core\" ActivitySource and on the instruments of its \"NServiceBus.Core.Pipeline.Incoming\" Meter, and that upstream semantic conventions 1.44.0 does not define. The header-promoted tags are written by ActivityDecorator.PromoteHeadersToTags, which maps one NServiceBus message header to one tag."
    attributes:
      - id: nservicebus.saga.saga_id
        type: string
        stability: development
        brief: "Id of the saga instance the message belongs to."
        note: "Span tag on the \"NServiceBus.Core\" ActivitySource. Declared at src/NServiceBus.Core/OpenTelemetry/Tracing/ActivityTags.cs:7; set at src/NServiceBus.Core/OpenTelemetry/Tracing/ActivityDecorator.cs:14 (PromoteHeadersToTags, HeaderMapping)."
        examples:
          - "0a7c5b3e-4f1d-4c8e-9b2a-6d1e8f3a7c20"
      - id: nservicebus.message_id
        type: string
        stability: development
        brief: "NServiceBus message id."
        note: "Span tag on the \"NServiceBus.Core\" ActivitySource. Declared at src/NServiceBus.Core/OpenTelemetry/Tracing/ActivityTags.cs:8; set at src/NServiceBus.Core/OpenTelemetry/Tracing/ActivityDecorator.cs:14 (PromoteHeadersToTags, HeaderMapping)."
        examples:
          - "b5e1c9d2-7a34-4f60-8c1b-2e9d4a6f1b73"
      - id: nservicebus.correlation_id
        type: string
        stability: development
        brief: "Correlation id of the message."
        note: "Span tag on the \"NServiceBus.Core\" ActivitySource. Declared at src/NServiceBus.Core/OpenTelemetry/Tracing/ActivityTags.cs:9; set at src/NServiceBus.Core/OpenTelemetry/Tracing/ActivityDecorator.cs:14 (PromoteHeadersToTags, HeaderMapping)."
        examples:
          - "3f8d2a61-90c4-4b7e-a5d8-17c6e0b94f25"
      - id: nservicebus.reply_to_address
        type: string
        stability: development
        brief: "Address replies to the message are sent to."
        note: "Span tag on the \"NServiceBus.Core\" ActivitySource. Declared at src/NServiceBus.Core/OpenTelemetry/Tracing/ActivityTags.cs:10; set at src/NServiceBus.Core/OpenTelemetry/Tracing/ActivityDecorator.cs:14 (PromoteHeadersToTags, HeaderMapping)."
        examples:
          - "Sales"
      - id: nservicebus.version
        type: string
        stability: development
        brief: "NServiceBus version that sent the message."
        note: "Span tag on the \"NServiceBus.Core\" ActivitySource. Declared at src/NServiceBus.Core/OpenTelemetry/Tracing/ActivityTags.cs:11; set at src/NServiceBus.Core/OpenTelemetry/Tracing/ActivityDecorator.cs:14 (PromoteHeadersToTags, HeaderMapping)."
        examples:
          - "10.2.9"
      - id: nservicebus.control_message
        type: string
        stability: development
        brief: "Marks the message as an NServiceBus control message."
        note: "Span tag on the \"NServiceBus.Core\" ActivitySource. Declared at src/NServiceBus.Core/OpenTelemetry/Tracing/ActivityTags.cs:12; set at src/NServiceBus.Core/OpenTelemetry/Tracing/ActivityDecorator.cs:14 (PromoteHeadersToTags, HeaderMapping)."
        examples:
          - "True"
      - id: nservicebus.saga.saga_type
        type: string
        stability: development
        brief: "Type name of the saga the message belongs to."
        note: "Span tag on the \"NServiceBus.Core\" ActivitySource. Declared at src/NServiceBus.Core/OpenTelemetry/Tracing/ActivityTags.cs:13; set at src/NServiceBus.Core/OpenTelemetry/Tracing/ActivityDecorator.cs:14 (PromoteHeadersToTags, HeaderMapping)."
        examples:
          - "Sales.OrderSaga, Sales, Version=1.0.0.0, Culture=neutral, PublicKeyToken=null"
      - id: nservicebus.originating_saga_id
        type: string
        stability: development
        brief: "Id of the saga that sent the message."
        note: "Span tag on the \"NServiceBus.Core\" ActivitySource. Declared at src/NServiceBus.Core/OpenTelemetry/Tracing/ActivityTags.cs:14; set at src/NServiceBus.Core/OpenTelemetry/Tracing/ActivityDecorator.cs:14 (PromoteHeadersToTags, HeaderMapping)."
        examples:
          - "0a7c5b3e-4f1d-4c8e-9b2a-6d1e8f3a7c20"
      - id: nservicebus.originating_saga_type
        type: string
        stability: development
        brief: "Type name of the saga that sent the message."
        note: "Span tag on the \"NServiceBus.Core\" ActivitySource. Declared at src/NServiceBus.Core/OpenTelemetry/Tracing/ActivityTags.cs:15; set at src/NServiceBus.Core/OpenTelemetry/Tracing/ActivityDecorator.cs:14 (PromoteHeadersToTags, HeaderMapping)."
        examples:
          - "Sales.OrderSaga, Sales, Version=1.0.0.0, Culture=neutral, PublicKeyToken=null"
      - id: nservicebus.delayed_retries
        type: string
        stability: development
        brief: "Number of delayed retries the message has been through."
        note: "Span tag on the \"NServiceBus.Core\" ActivitySource. Declared at src/NServiceBus.Core/OpenTelemetry/Tracing/ActivityTags.cs:16; set at src/NServiceBus.Core/OpenTelemetry/Tracing/ActivityDecorator.cs:14 (PromoteHeadersToTags, HeaderMapping)."
        examples:
          - "1"
          - "2"
      - id: nservicebus.delayed_retries_timestamp
        type: string
        stability: development
        brief: "Timestamp of the last delayed retry of the message."
        note: "Span tag on the \"NServiceBus.Core\" ActivitySource. Declared at src/NServiceBus.Core/OpenTelemetry/Tracing/ActivityTags.cs:17; set at src/NServiceBus.Core/OpenTelemetry/Tracing/ActivityDecorator.cs:14 (PromoteHeadersToTags, HeaderMapping)."
        examples:
          - "2026-10-14 09:15:30:123456 Z"
      - id: nservicebus.deliver_at
        type: string
        stability: development
        brief: "Time the message is to be delivered at."
        note: "Span tag on the \"NServiceBus.Core\" ActivitySource. Declared at src/NServiceBus.Core/OpenTelemetry/Tracing/ActivityTags.cs:18; set at src/NServiceBus.Core/OpenTelemetry/Tracing/ActivityDecorator.cs:14 (PromoteHeadersToTags, HeaderMapping)."
        examples:
          - "2026-10-14 09:20:00:000000 Z"
      - id: nservicebus.related_to
        type: string
        stability: development
        brief: "Id of the message this message relates to."
        note: "Span tag on the \"NServiceBus.Core\" ActivitySource. Declared at src/NServiceBus.Core/OpenTelemetry/Tracing/ActivityTags.cs:19; set at src/NServiceBus.Core/OpenTelemetry/Tracing/ActivityDecorator.cs:14 (PromoteHeadersToTags, HeaderMapping)."
        examples:
          - "b5e1c9d2-7a34-4f60-8c1b-2e9d4a6f1b73"
      - id: nservicebus.enclosed_message_types
        type: string
        stability: development
        brief: "Message types enclosed in the message body."
        note: "Span tag on the \"NServiceBus.Core\" ActivitySource. Declared at src/NServiceBus.Core/OpenTelemetry/Tracing/ActivityTags.cs:20; set at src/NServiceBus.Core/OpenTelemetry/Tracing/ActivityDecorator.cs:14 (PromoteHeadersToTags, HeaderMapping)."
        examples:
          - "Messages.PlaceOrder, Messages, Version=1.0.0.0, Culture=neutral, PublicKeyToken=null"
          - "Messages.PlaceOrder"
      - id: nservicebus.content_type
        type: string
        stability: development
        brief: "Content type of the message body."
        note: "Span tag on the \"NServiceBus.Core\" ActivitySource. Declared at src/NServiceBus.Core/OpenTelemetry/Tracing/ActivityTags.cs:21; set at src/NServiceBus.Core/OpenTelemetry/Tracing/ActivityDecorator.cs:14 (PromoteHeadersToTags, HeaderMapping)."
        examples:
          - "application/json"
          - "text/xml"
      - id: nservicebus.saga.is_timeout
        type: string
        stability: development
        brief: "Marks the message as a saga timeout."
        note: "Span tag on the \"NServiceBus.Core\" ActivitySource. Declared at src/NServiceBus.Core/OpenTelemetry/Tracing/ActivityTags.cs:22; set at src/NServiceBus.Core/OpenTelemetry/Tracing/ActivityDecorator.cs:14 (PromoteHeadersToTags, HeaderMapping)."
        examples:
          - "True"
      - id: nservicebus.is_deferred
        type: string
        stability: development
        brief: "Marks the message as deferred."
        note: "Span tag on the \"NServiceBus.Core\" ActivitySource. Declared at src/NServiceBus.Core/OpenTelemetry/Tracing/ActivityTags.cs:23; set at src/NServiceBus.Core/OpenTelemetry/Tracing/ActivityDecorator.cs:14 (PromoteHeadersToTags, HeaderMapping). Promoted from the `NServiceBus.IsDeferredMessage` header when a message carries it (ActivityDecorator.cs:39); NServiceBus.Core 10.2.9 itself never sets that header, so the tag appears only for messages whose sender (another NServiceBus package or an older endpoint) did."
        examples:
          - "True"
      - id: nservicebus.originating_endpoint
        type: string
        stability: development
        brief: "Endpoint that sent the message."
        note: "Span tag on the \"NServiceBus.Core\" ActivitySource. Declared at src/NServiceBus.Core/OpenTelemetry/Tracing/ActivityTags.cs:24; set at src/NServiceBus.Core/OpenTelemetry/Tracing/ActivityDecorator.cs:14 (PromoteHeadersToTags, HeaderMapping)."
        examples:
          - "Sales"
      - id: nservicebus.originating_machine
        type: string
        stability: development
        brief: "Machine that sent the message."
        note: "Span tag on the \"NServiceBus.Core\" ActivitySource. Declared at src/NServiceBus.Core/OpenTelemetry/Tracing/ActivityTags.cs:25; set at src/NServiceBus.Core/OpenTelemetry/Tracing/ActivityDecorator.cs:14 (PromoteHeadersToTags, HeaderMapping)."
        examples:
          - "build-agent-01"
      - id: nservicebus.originating_host_id
        type: string
        stability: development
        brief: "Host id that sent the message."
        note: "Span tag on the \"NServiceBus.Core\" ActivitySource. Declared at src/NServiceBus.Core/OpenTelemetry/Tracing/ActivityTags.cs:26; set at src/NServiceBus.Core/OpenTelemetry/Tracing/ActivityDecorator.cs:14 (PromoteHeadersToTags, HeaderMapping)."
        examples:
          - "6f9619ff8b86d011b42d00c04fc964ff"
      - id: nservicebus.processing_endpoint
        type: string
        stability: development
        brief: "Endpoint processing the message."
        note: "Span tag on the \"NServiceBus.Core\" ActivitySource. Declared at src/NServiceBus.Core/OpenTelemetry/Tracing/ActivityTags.cs:27; set at src/NServiceBus.Core/OpenTelemetry/Tracing/ActivityDecorator.cs:14 (PromoteHeadersToTags, HeaderMapping)."
        examples:
          - "Billing"
      - id: nservicebus.processing_machine
        type: string
        stability: development
        brief: "Machine processing the message."
        note: "Span tag on the \"NServiceBus.Core\" ActivitySource. Declared at src/NServiceBus.Core/OpenTelemetry/Tracing/ActivityTags.cs:28; set at src/NServiceBus.Core/OpenTelemetry/Tracing/ActivityDecorator.cs:14 (PromoteHeadersToTags, HeaderMapping)."
        examples:
          - "build-agent-02"
      - id: nservicebus.host.display_name
        type: string
        stability: development
        brief: "Display name of the host."
        note: "Span tag on the \"NServiceBus.Core\" ActivitySource. Declared at src/NServiceBus.Core/OpenTelemetry/Tracing/ActivityTags.cs:29; set at src/NServiceBus.Core/OpenTelemetry/Tracing/ActivityDecorator.cs:14 (PromoteHeadersToTags, HeaderMapping)."
        examples:
          - "build-agent-01"
      - id: nservicebus.host.host_id
        type: string
        stability: development
        brief: "Id of the host."
        note: "Span tag on the \"NServiceBus.Core\" ActivitySource. Declared at src/NServiceBus.Core/OpenTelemetry/Tracing/ActivityTags.cs:30; set at src/NServiceBus.Core/OpenTelemetry/Tracing/ActivityDecorator.cs:14 (PromoteHeadersToTags, HeaderMapping)."
        examples:
          - "6f9619ff8b86d011b42d00c04fc964ff"
      - id: nservicebus.has_license_expired
        type: string
        stability: development
        brief: "Whether the license of the endpoint that sent the message had expired."
        note: "Span tag on the \"NServiceBus.Core\" ActivitySource. Declared at src/NServiceBus.Core/OpenTelemetry/Tracing/ActivityTags.cs:31; set at src/NServiceBus.Core/OpenTelemetry/Tracing/ActivityDecorator.cs:14 (PromoteHeadersToTags, HeaderMapping)."
        examples:
          - "true"
      - id: nservicebus.originating_address
        type: string
        stability: development
        brief: "Address the message originated from."
        note: "Span tag on the \"NServiceBus.Core\" ActivitySource. Declared at src/NServiceBus.Core/OpenTelemetry/Tracing/ActivityTags.cs:32; set at src/NServiceBus.Core/OpenTelemetry/Tracing/ActivityDecorator.cs:14 (PromoteHeadersToTags, HeaderMapping). Promoted from the `NServiceBus.OriginatingAddress` header when a message carries it (ActivityDecorator.cs:48); NServiceBus.Core 10.2.9 itself never sets that header, so the tag appears only for messages whose sender (another NServiceBus package or an older endpoint) did."
        examples:
          - "Samples.ComplexSagaFindingLogic@MACHINEA"
      - id: nservicebus.conversation_id
        type: string
        stability: development
        brief: "Conversation id of the message."
        note: "Span tag on the \"NServiceBus.Core\" ActivitySource. Declared at src/NServiceBus.Core/OpenTelemetry/Tracing/ActivityTags.cs:33; set at src/NServiceBus.Core/OpenTelemetry/Tracing/ActivityDecorator.cs:14 (PromoteHeadersToTags, HeaderMapping)."
        examples:
          - "3f8d2a61-90c4-4b7e-a5d8-17c6e0b94f25"
      - id: nservicebus.previous_conversation_id
        type: string
        stability: development
        brief: "Conversation id the message's conversation was started from."
        note: "Span tag on the \"NServiceBus.Core\" ActivitySource. Declared at src/NServiceBus.Core/OpenTelemetry/Tracing/ActivityTags.cs:34; set at src/NServiceBus.Core/OpenTelemetry/Tracing/ActivityDecorator.cs:14 (PromoteHeadersToTags, HeaderMapping)."
        examples:
          - "0a7c5b3e-4f1d-4c8e-9b2a-6d1e8f3a7c20"
      - id: nservicebus.message_intent
        type: string
        stability: development
        brief: "Intent of the message (send, publish, subscribe, reply)."
        note: "Span tag on the \"NServiceBus.Core\" ActivitySource. Declared at src/NServiceBus.Core/OpenTelemetry/Tracing/ActivityTags.cs:35; set at src/NServiceBus.Core/OpenTelemetry/Tracing/ActivityDecorator.cs:14 (PromoteHeadersToTags, HeaderMapping)."
        examples:
          - "Send"
          - "Publish"
          - "Reply"
      - id: nservicebus.time_to_be_received
        type: string
        stability: development
        brief: "Time-to-be-received of the message."
        note: "Span tag on the \"NServiceBus.Core\" ActivitySource. Declared at src/NServiceBus.Core/OpenTelemetry/Tracing/ActivityTags.cs:36; set at src/NServiceBus.Core/OpenTelemetry/Tracing/ActivityDecorator.cs:14 (PromoteHeadersToTags, HeaderMapping)."
        examples:
