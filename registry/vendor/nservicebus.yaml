  - id: vendor.nservicebus
    type: attribute_group
    display_name: "NServiceBus Vendor Metadata"
    brief: "The pinned NServiceBus release qyl read its ActivitySource and attribute findings at."
    annotations:
      qyl:
        vendor:
          library: "NServiceBus"
          version: "10.2.9"
          repository: "https://github.com/Particular/NServiceBus"
          ref: "10.2.9"
          license: "RPL-1.5"
          activity_sources:
            - name: "NServiceBus.Core"
              note: "ActivitySources.Main at src/NServiceBus.Core/OpenTelemetry/Tracing/ActivitySources.cs:10. The endpoint's instruments live on a differently named Meter, \"NServiceBus.Core.Pipeline.Incoming\", created at src/NServiceBus.Core/Pipeline/Incoming/IncomingPipelineMetrics.cs:27."
    attributes:
      - ref: qyl.instrumentation.domain
