  - id: metric.vendor.quartz_net.cluster_recovery_trigger
    type: metric
    metric_name: quartz.cluster.recovery.trigger
    instrument: counter
    unit: '{trigger}'
    stability: development
    brief: Number of fired triggers recovered from a failed cluster node.
    note: Quartz.NET 4.4.0 native Meter "Quartz". Instrument created at src/Quartz/Diagnostics/Meters.cs:107; dimensions and
      measurements at src/Quartz/Diagnostics/Meters.cs:360-378,390-404, tag constants at src/Quartz/Diagnostics/ActivityTags.cs.
      Read at https://github.com/quartznet/quartznet/blob/v4.4.0/src/Quartz/Diagnostics/Meters.cs. On self-recovery the counter
      records one recovery event, with the recovered instance equal to the reporting scheduler instance; the trigger count is
      no longer available.
    attributes:
