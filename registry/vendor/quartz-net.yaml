# Quartz.NET 4.4.0 — the attributes the library puts on the spans of its own
# ActivitySource and that upstream semantic conventions do not define. Vendor keys are
# tags: the collector passes them through, the application never renames them.
#
# Three kinds of groups: `registry.vendor.*` carries the attributes into the resolved catalog (which
# drops group annotations), `vendor.*` carries the library metadata, which survives as a
# plain attribute group. The metric.vendor.* groups describe all 11 native instruments.
groups:
  - id: registry.vendor.quartz_net
    type: attribute_group
    display_name: "Quartz.NET Vendor Attributes"
    brief: "Attributes Quartz.NET 4.4.0 puts on the spans of its own \"Quartz\" ActivitySource and on the instruments of its \"Quartz\" Meter, and that upstream semantic conventions 1.44.0 does not define."
    attributes:
      - id: quartz.scheduler.name
        type: string
        stability: development
        brief: "Name of the scheduler that produced the telemetry."
        note: "Span tag on the \"Quartz\" ActivitySource. Declared at src/Quartz/Diagnostics/ActivityTags.cs:27; set at src/Quartz/Diagnostics/QuartzActivitySource.cs:141 and src/Quartz/Diagnostics/TracingJobStore.cs:708."
        examples:
          - "QuartzScheduler"
          - "OrderScheduler"
      - id: quartz.scheduler.id
        type: string
        stability: development
        brief: "Instance id of the scheduler that produced the telemetry, which is what tells two cluster nodes apart."
        note: "Span tag on the \"Quartz\" ActivitySource. Declared at src/Quartz/Diagnostics/ActivityTags.cs:32; set at src/Quartz/Diagnostics/QuartzActivitySource.cs:142 and src/Quartz/Diagnostics/TracingJobStore.cs:709."
        examples:
          - "NON_CLUSTERED"
          - "web-01"
          - "web-011790466385049"
      - id: quartz.fire.instance.id
        type: string
        stability: development
        brief: "Identity of one firing, which is what an interrupt names."
        note: "Span tag on the \"Quartz\" ActivitySource. Declared at src/Quartz/Diagnostics/ActivityTags.cs:37; set at src/Quartz/Diagnostics/QuartzActivitySource.cs:144."
        examples:
          - "NON_CLUSTERED1790466385049"
          - "1790466385049"
      - id: quartz.trigger.group
        type: string
        stability: development
        brief: "Group of the trigger that fired."
        note: "Span tag on the \"Quartz\" ActivitySource. Declared at src/Quartz/Diagnostics/ActivityTags.cs:42; set at src/Quartz/Diagnostics/QuartzActivitySource.cs:147 and src/Quartz/Diagnostics/TracingJobStore.cs:892."
        examples:
          - "DEFAULT"
          - "reports"
      - id: quartz.trigger.name
        type: string
        stability: development
        brief: "Name of the trigger that fired."
        note: "Span tag on the \"Quartz\" ActivitySource. Declared at src/Quartz/Diagnostics/ActivityTags.cs:47; set at src/Quartz/Diagnostics/QuartzActivitySource.cs:148 and src/Quartz/Diagnostics/TracingJobStore.cs:893."
        examples:
          - "nightly-report-trigger"
      - id: quartz.job.type
        type: string
        stability: development
        brief: "Namespace-qualified full name of the job type (`JobType.ToString()`), not assembly-qualified."
        note: "Span tag on the \"Quartz\" ActivitySource. Declared at src/Quartz/Diagnostics/ActivityTags.cs:52; set at src/Quartz/Diagnostics/QuartzActivitySource.cs:143."
        examples:
          - "MyApp.Jobs.ReportJob"
      - id: quartz.job.group
        type: string
        stability: development
        brief: "Group of the job."
        note: "Span tag on the \"Quartz\" ActivitySource. Declared at src/Quartz/Diagnostics/ActivityTags.cs:57; set at src/Quartz/Diagnostics/QuartzActivitySource.cs:149 and src/Quartz/Diagnostics/TracingJobStore.cs:881."
        examples:
          - "DEFAULT"
          - "reports"
      - id: quartz.job.name
        type: string
        stability: development
        brief: "Name of the job."
        note: "Span tag on the \"Quartz\" ActivitySource. Declared at src/Quartz/Diagnostics/ActivityTags.cs:62; set at src/Quartz/Diagnostics/QuartzActivitySource.cs:150 and src/Quartz/Diagnostics/TracingJobStore.cs:882."
        examples:
          - "nightly-report"
      - id: quartz.execution.group
        type: string
        stability: development
        brief: "Execution group the trigger belongs to, which is the bucket a thread limit is applied per. A trigger that names no execution group carries no such attribute at all."
        note: "Span tag on the \"Quartz\" ActivitySource. Declared at src/Quartz/Diagnostics/ActivityTags.cs:72; set at src/Quartz/Diagnostics/QuartzActivitySource.cs:158."
        examples:
          - "tenant:acme"
      - id: quartz.jobstore.trigger.count
        type: int
        stability: development
        brief: "Number of triggers a job-store operation was asked for, or handed back."
        note: "Span tag on the \"Quartz\" ActivitySource. Declared at src/Quartz/Diagnostics/ActivityTags.cs:93; set at src/Quartz/Diagnostics/TracingJobStore.cs:682,805,835."
      - id: quartz.jobstore.batch.size
        type: int
        stability: development
        brief: "Number of triggers the scheduler asked its store for in one acquisition attempt."
        note: "Span tag on the \"Quartz\" ActivitySource. Declared at src/Quartz/Diagnostics/ActivityTags.cs:98; set at src/Quartz/Diagnostics/TracingJobStore.cs:650,669."
      - id: quartz.jobstore.trigger.fired_on_acquire
        type: int
        stability: development
        brief: "Number of the acquired triggers that were already due and fired on acquisition, as opposed to pending."
        note: "Span tag on the \"Quartz\" ActivitySource, new in 4.4.0. Declared at src/Quartz/Diagnostics/ActivityTags.cs:104; set at src/Quartz/Diagnostics/TracingJobStore.cs:836, next to the `quartz.jobstore.trigger.count` of the same acquisition at :835."
      - id: quartz.job.result
        type: string
        stability: development
        brief: "What a job run achieved, as the `JobRunResult` member name: the same classification the execution-duration histogram is tagged with and the history row records."
        note: "Span tag on the \"Quartz\" ActivitySource and metric tag on the \"Quartz\" Meter, new in 4.4.0. Declared at src/Quartz/Diagnostics/ActivityTags.cs:87; set on the job-execution span at src/Quartz/Diagnostics/QuartzActivitySource.cs:215 and on `quartz.job.execution.duration` at src/Quartz/Diagnostics/Meters.cs:460, both through `Meters.JobResultTag` at src/Quartz/Diagnostics/Meters.cs:485."
        examples:
          - "succeeded"
          - "failed"
          - "cancelled"
      - id: quartz.jobstore.lock
        type: string
        stability: development
        brief: "Name of the job-store lock a wait was measured for."
        note: "Metric tag on the \"Quartz\" Meter, new in 4.4.0, the dimension of the `quartz.jobstore.lock.wait.duration` histogram created at src/Quartz/Diagnostics/Meters.cs:117. Declared at src/Quartz/Diagnostics/ActivityTags.cs:121; set at src/Quartz/Diagnostics/Meters.cs:221."
        examples:
          - "TRIGGER_ACCESS"
          - "STATE_ACCESS"
      - id: quartz.jobstore.operation
        type: string
        stability: development
        brief: "Job-store operation a measurement is about."
        note: "Metric tag on the \"Quartz\" Meter. Declared at src/Quartz/Diagnostics/ActivityTags.cs:110; set at src/Quartz/Diagnostics/Meters.cs:189."
        examples:
          - "Quartz.JobStore.AcquireNextTriggers"
          - "Quartz.JobStore.TriggersFired"
      - id: quartz.cluster.recovered.instance.id
        type: string
        stability: development
        brief: "Instance id of the cluster node whose work is being recovered. On self-recovery this equals the reporting scheduler instance id."
        note: "Metric tag on the \"Quartz\" Meter. Declared at src/Quartz/Diagnostics/ActivityTags.cs:132; set at src/Quartz/Diagnostics/Meters.cs:373,401."
        examples:
          - "web-021790466385049"
  - id: vendor.quartz_net
    type: attribute_group
    display_name: "Quartz.NET Vendor Metadata"
    brief: "The pinned Quartz.NET release qyl read its ActivitySource and attribute findings at."
    annotations:
      qyl:
        vendor:
          library: "Quartz.NET"
          version: "4.4.0"
          repository: "https://github.com/quartznet/quartznet"
          ref: "v4.4.0"
          license: "Apache-2.0"
          activity_sources:
            - name: "Quartz"
              note: "QuartzInstrumentation.ActivitySourceName at src/Quartz/Diagnostics/QuartzInstrumentation.cs:23; QuartzInstrumentation.MeterName at src/Quartz/Diagnostics/QuartzInstrumentation.cs:34 is the same string."
    attributes:
      - ref: qyl.instrumentation.domain


  - id: metric.vendor.quartz_net.job_execution_active
    type: metric
    metric_name: quartz.job.execution.active
    instrument: updowncounter
    unit: '{job}'
    stability: development
    brief: Number of jobs currently running.
    note: Quartz.NET 4.4.0 native Meter "Quartz". Instrument created at src/Quartz/Diagnostics/Meters.cs:67; dimensions and
      measurements at src/Quartz/Diagnostics/Meters.cs:414-437,455, tag constants at src/Quartz/Diagnostics/ActivityTags.cs.
      Read at https://github.com/quartznet/quartznet/blob/v4.4.0/src/Quartz/Diagnostics/Meters.cs. The running count is decremented
      with its original dimensions before result and error dimensions are added to the duration histogram.
    attributes:
    - ref: quartz.scheduler.name
      requirement_level: required
    - ref: quartz.scheduler.id
      requirement_level: required
    - ref: quartz.trigger.group
      requirement_level: required
    - ref: quartz.trigger.name
      requirement_level: required
    - ref: quartz.job.group
      requirement_level: required
    - ref: quartz.job.name
      requirement_level: required
    - ref: quartz.execution.group
      requirement_level:
        conditionally_required: If the trigger declares an execution group.
    annotations:
      code_generation:
        metric_value_type: int
  - id: metric.vendor.quartz_net.job_execution_duration
    type: metric
    metric_name: quartz.job.execution.duration
    instrument: histogram
    unit: s
    stability: development
    brief: Elapsed time spent executing a job.
    note: Quartz.NET 4.4.0 native Meter "Quartz". Instrument created at src/Quartz/Diagnostics/Meters.cs:72; dimensions and
      measurements at src/Quartz/Diagnostics/Meters.cs:414-437,450-472, tag constants at src/Quartz/Diagnostics/ActivityTags.cs.
      Read at https://github.com/quartznet/quartznet/blob/v4.4.0/src/Quartz/Diagnostics/Meters.cs.
    attributes:
    - ref: quartz.scheduler.name
      requirement_level: required
    - ref: quartz.scheduler.id
      requirement_level: required
    - ref: quartz.trigger.group
      requirement_level: required
    - ref: quartz.trigger.name
      requirement_level: required
    - ref: quartz.job.group
      requirement_level: required
    - ref: quartz.job.name
      requirement_level: required
    - ref: quartz.job.result
      requirement_level: required
    - ref: quartz.execution.group
      requirement_level:
        conditionally_required: If the trigger declares an execution group.
    - ref: error.type
      requirement_level:
        conditionally_required: If Quartz records an exception for the job execution.
