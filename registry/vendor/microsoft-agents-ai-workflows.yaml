# Microsoft.Agents.AI.Workflows 1.24.0 — the attributes the Agent Framework's workflow runtime
# puts on the spans of its own "Microsoft.Agents.AI.Workflows" ActivitySource and that upstream
# semantic conventions do not define. Vendor keys are tags: the collector passes them through,
# the application never renames them. The library publishes no Meter.
#
# Four of the keys in its Tags.cs are not declared here because upstream already defines them:
# `error.type`, `error.message` and `session.id` are the upstream keys and travel as such, and
# `message.type` is upstream's RPC message-type key (enum SENT/RECEIVED), deprecated in 1.44.0 as
# obsoleted with no replacement. `AttributeMapping.IsObsoleted` is true for it, so the collector
# drops the workflow's .NET type name at ingest and counts the drop under `message`. That
# collision is the library's, and a vendor row cannot redeclare a key the catalog has.
#
# Two groups: `registry.vendor.*` carries the attributes into the resolved catalog (which drops
# group annotations), `vendor.*` carries the library metadata, which survives as a plain
# attribute group.
groups:
  - id: registry.vendor.microsoft_agents_ai_workflows
    type: attribute_group
    display_name: "Microsoft.Agents.AI.Workflows Vendor Attributes"
    brief: "Attributes Microsoft.Agents.AI.Workflows 1.24.0 puts on the spans of its own \"Microsoft.Agents.AI.Workflows\" ActivitySource and that upstream semantic conventions 1.44.0 and semantic-conventions-genai at the pinned commit do not define."
    attributes:
      - id: workflow.id
        type: string
        stability: development
        brief: "Id of the workflow, which Microsoft.Agents.AI.Workflows 1.24.0 takes from its start executor."
        note: "Span tag on the \"Microsoft.Agents.AI.Workflows\" ActivitySource. Declared at dotnet/src/Microsoft.Agents.AI.Workflows/Observability/Tags.cs:7; set at dotnet/src/Microsoft.Agents.AI.Workflows/WorkflowBuilder.cs:645 on `workflow.build`, at dotnet/src/Microsoft.Agents.AI.Workflows/Execution/LockstepRunEventStream.cs:42,67 and dotnet/src/Microsoft.Agents.AI.Workflows/Execution/StreamingRunEventStream.cs:71,91 on `workflow.session` and `workflow_invoke`. The value is `workflow.StartExecutorId`."
        examples:
          - "Uppercase"
      - id: workflow.name
        type: string
        stability: development
        brief: "Name given to the workflow."
        note: "Span tag on the \"Microsoft.Agents.AI.Workflows\" ActivitySource. Declared at dotnet/src/Microsoft.Agents.AI.Workflows/Observability/Tags.cs:8; set at dotnet/src/Microsoft.Agents.AI.Workflows/WorkflowBuilder.cs:648 on `workflow.build`, when the workflow has a name."
        examples:
          - "Uppercase pipeline"
      - id: workflow.description
        type: string
        stability: development
        brief: "Description given to the workflow."
        note: "Span tag on the \"Microsoft.Agents.AI.Workflows\" ActivitySource. Declared at dotnet/src/Microsoft.Agents.AI.Workflows/Observability/Tags.cs:9; set at dotnet/src/Microsoft.Agents.AI.Workflows/WorkflowBuilder.cs:652 on `workflow.build`, when the workflow has a description."
        examples:
          - "Uppercases the input text and emits it."
      - id: workflow.definition
        type: string
        stability: development
        brief: "The workflow's executors and edges, serialized as JSON."
        note: "Span tag on the \"Microsoft.Agents.AI.Workflows\" ActivitySource. Declared at dotnet/src/Microsoft.Agents.AI.Workflows/Observability/Tags.cs:10; set at dotnet/src/Microsoft.Agents.AI.Workflows/WorkflowBuilder.cs:655 on `workflow.build`."
        examples:
          - '{"executors":{"Uppercase":{"executorType":{"assemblyName":"MyApp, Version=1.0.0.0, Culture=neutral, PublicKeyToken=null","typeName":"MyApp.UppercaseExecutor"},"executorId":"Uppercase"}},"edges":{},"requestPorts":[],"startExecutorId":"Uppercase","outputExecutorIds":{}}'
      - id: build.error.message
        type: string
        stability: development
        brief: "Message of the exception that failed building the workflow."
        note: "Tag of the `build.error` activity event on the \"Microsoft.Agents.AI.Workflows\" ActivitySource. Declared at dotnet/src/Microsoft.Agents.AI.Workflows/Observability/Tags.cs:11; set at dotnet/src/Microsoft.Agents.AI.Workflows/WorkflowBuilder.cs:627."
        examples:
          - "Workflow cannot be built because there are unreachable executors: Reverse."
          - "Workflow cannot be built because there are unbound executors: Uppercase."
      - id: build.error.type
        type: string
        stability: development
        brief: "Full type name of the exception that failed building the workflow."
        note: "Tag of the `build.error` activity event on the \"Microsoft.Agents.AI.Workflows\" ActivitySource. Declared at dotnet/src/Microsoft.Agents.AI.Workflows/Observability/Tags.cs:12; set at dotnet/src/Microsoft.Agents.AI.Workflows/WorkflowBuilder.cs:628."
        examples:
          - "System.InvalidOperationException"
      - id: executor.id
        type: string
        stability: development
        brief: "Id of the executor processing the message."
        note: "Span tag on the \"Microsoft.Agents.AI.Workflows\" ActivitySource. Declared at dotnet/src/Microsoft.Agents.AI.Workflows/Observability/Tags.cs:16; set at dotnet/src/Microsoft.Agents.AI.Workflows/Observability/WorkflowTelemetryContext.cs:144 on `executor.process`."
        examples:
          - "Uppercase"
      - id: executor.type
        type: string
        stability: development
        brief: "Type name of the executor processing the message."
        note: "Span tag on the \"Microsoft.Agents.AI.Workflows\" ActivitySource. Declared at dotnet/src/Microsoft.Agents.AI.Workflows/Observability/Tags.cs:17; set at dotnet/src/Microsoft.Agents.AI.Workflows/Observability/WorkflowTelemetryContext.cs:145 on `executor.process`."
        examples:
          - "MyApp.UppercaseExecutor"
      - id: executor.input
        type: string
        stability: development
        brief: "The message an executor received, serialized as JSON."
        note: "Span tag on the \"Microsoft.Agents.AI.Workflows\" ActivitySource. Declared at dotnet/src/Microsoft.Agents.AI.Workflows/Observability/Tags.cs:18; set at dotnet/src/Microsoft.Agents.AI.Workflows/Observability/WorkflowTelemetryContext.cs:150 on `executor.process`, only when `WorkflowTelemetryOptions.EnableSensitiveData` is on. A payload, not metadata: the Qyl.Telemetry.AutoInstrumentation GenAI demo asserts its absence under the default options."
        examples:
          - '"hello world"'
      - id: executor.output
        type: string
        stability: development
        brief: "The output an executor produced, serialized as JSON."
        note: "Span tag on the \"Microsoft.Agents.AI.Workflows\" ActivitySource. Declared at dotnet/src/Microsoft.Agents.AI.Workflows/Observability/Tags.cs:19; set at dotnet/src/Microsoft.Agents.AI.Workflows/Observability/WorkflowTelemetryContext.cs:165 on `executor.process`, only when `WorkflowTelemetryOptions.EnableSensitiveData` is on. A payload, not metadata."
        examples:
          - '"HELLO WORLD"'
      - id: message.content
        type: string
        stability: development
        brief: "The message sent along an edge, serialized as JSON."
        note: "Span tag on the \"Microsoft.Agents.AI.Workflows\" ActivitySource. Declared at dotnet/src/Microsoft.Agents.AI.Workflows/Observability/Tags.cs:21; set at dotnet/src/Microsoft.Agents.AI.Workflows/Observability/WorkflowTelemetryContext.cs:211 on `message.send`, only when `WorkflowTelemetryOptions.EnableSensitiveData` is on. A payload, not metadata."
        examples:
          - '"HELLO WORLD"'
      - id: message.source_id
        type: string
        stability: development
        brief: "Id of the executor a message was sent from."
        note: "Span tag on the \"Microsoft.Agents.AI.Workflows\" ActivitySource. Declared at dotnet/src/Microsoft.Agents.AI.Workflows/Observability/Tags.cs:23; set at dotnet/src/Microsoft.Agents.AI.Workflows/Observability/WorkflowTelemetryContext.cs:203 on `message.send` and at dotnet/src/Microsoft.Agents.AI.Workflows/Execution/DirectEdgeRunner.cs:18, dotnet/src/Microsoft.Agents.AI.Workflows/Execution/FanOutEdgeRunner.cs:20 and dotnet/src/Microsoft.Agents.AI.Workflows/Execution/ResponseEdgeRunner.cs:32 on `edge_group.process`. On `edge_group.process` a Direct, FanOut or Response edge sets it; a FanIn edge, which has several sources, does not."
        examples:
          - "Uppercase"
      - id: message.target_id
        type: string
        stability: development
        brief: "Id of the executor a message is delivered to."
        note: "Span tag on the \"Microsoft.Agents.AI.Workflows\" ActivitySource. Declared at dotnet/src/Microsoft.Agents.AI.Workflows/Observability/Tags.cs:24; set at dotnet/src/Microsoft.Agents.AI.Workflows/Observability/WorkflowTelemetryContext.cs:206 on `message.send` and at dotnet/src/Microsoft.Agents.AI.Workflows/Execution/DirectEdgeRunner.cs:19, dotnet/src/Microsoft.Agents.AI.Workflows/Execution/FanInEdgeRunner.cs:26 and dotnet/src/Microsoft.Agents.AI.Workflows/Execution/ResponseEdgeRunner.cs:33 on `edge_group.process`. On `edge_group.process` a Direct, FanIn or Response edge sets it; a FanOut edge, which has several targets, does not."
        examples:
          - "Reverse"
      - id: edge_group.type
        type: string
        stability: development
        brief: "The edge runner that delivered the message: DirectEdgeRunner, FanInEdgeRunner, FanOutEdgeRunner or ResponseEdgeRunner."
        note: "Span tag on the \"Microsoft.Agents.AI.Workflows\" ActivitySource. Declared at dotnet/src/Microsoft.Agents.AI.Workflows/Observability/Tags.cs:22; set at dotnet/src/Microsoft.Agents.AI.Workflows/Execution/DirectEdgeRunner.cs:17, dotnet/src/Microsoft.Agents.AI.Workflows/Execution/FanInEdgeRunner.cs:25, dotnet/src/Microsoft.Agents.AI.Workflows/Execution/FanOutEdgeRunner.cs:19 and dotnet/src/Microsoft.Agents.AI.Workflows/Execution/ResponseEdgeRunner.cs:31 on `edge_group.process`, each with its own `nameof`."
        examples:
          - "DirectEdgeRunner"
          - "FanOutEdgeRunner"
          - "FanInEdgeRunner"
          - "ResponseEdgeRunner"
      - id: edge_group.delivered
        type: boolean
        stability: development
        brief: "Whether the edge group delivered the message."
        note: "Span tag on the \"Microsoft.Agents.AI.Workflows\" ActivitySource. Declared at dotnet/src/Microsoft.Agents.AI.Workflows/Observability/Tags.cs:25; set at dotnet/src/Microsoft.Agents.AI.Workflows/Observability/ActivityExtensions.cs:31 on `edge_group.process`."
      - id: edge_group.delivery_status
        type: string
        stability: development
        brief: "Why the edge group did or did not deliver the message, as `EdgeRunnerDeliveryStatus`."
        note: "Span tag on the \"Microsoft.Agents.AI.Workflows\" ActivitySource. Declared at dotnet/src/Microsoft.Agents.AI.Workflows/Observability/Tags.cs:26; set at dotnet/src/Microsoft.Agents.AI.Workflows/Observability/ActivityExtensions.cs:32 on `edge_group.process`."
        examples:
          - "delivered"
          - "dropped type mismatch"
          - "dropped condition false"
  - id: vendor.microsoft_agents_ai_workflows
    type: attribute_group
    display_name: "Microsoft.Agents.AI.Workflows Vendor Metadata"
    brief: "The pinned Microsoft.Agents.AI.Workflows release qyl read its ActivitySource and attribute findings at."
    annotations:
      qyl:
        vendor:
          library: "Microsoft.Agents.AI.Workflows"
          version: "1.24.0"
          repository: "https://github.com/microsoft/agent-framework"
          ref: "dotnet-1.24.0"
          license: "MIT"
          activity_sources:
            - name: "Microsoft.Agents.AI.Workflows"
              note: "`WorkflowTelemetryContext.DefaultSourceName` and the static ActivitySource built from it at dotnet/src/Microsoft.Agents.AI.Workflows/Observability/WorkflowTelemetryContext.cs:15-16; `WorkflowBuilder.WithOpenTelemetry()` (dotnet/src/Microsoft.Agents.AI.Workflows/OpenTelemetryWorkflowBuilderExtensions.cs) hands a context over, and the spans are `workflow.build`, `workflow.session`, `workflow_invoke`, `message.send`, `executor.process` and `edge_group.process` (dotnet/src/Microsoft.Agents.AI.Workflows/Observability/ActivityNames.cs:7-12). The library creates no Meter."
    attributes:
      - ref: qyl.instrumentation.domain
